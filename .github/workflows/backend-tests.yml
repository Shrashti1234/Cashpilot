name: Backend tests
permissions:
  contents: read
on:
  push:
    branches: [main, feature/saas-foundation]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Start dedicated loopback PostgreSQL fixture
        shell: bash
        run: |
          pg_admin_password=$(python -c 'import secrets; print(secrets.token_urlsafe(36))')
          pg_runtime_password=$(python -c 'import secrets; print(secrets.token_urlsafe(36))')
          echo "::add-mask::$pg_admin_password"
          echo "::add-mask::$pg_runtime_password"
          export POSTGRES_PASSWORD="$pg_admin_password"
          docker run --detach --rm --name cashpilot-pg-checks --publish 127.0.0.1:55439:5432 --env POSTGRES_PASSWORD --env POSTGRES_DB=cashpilot_checks --health-cmd 'pg_isready -U postgres -d cashpilot_checks' --health-interval 2s --health-timeout 5s --health-retries 20 postgres:17
          pg_ready=0
          for attempt in $(seq 1 30); do
            if docker exec cashpilot-pg-checks pg_isready -U postgres -d cashpilot_checks; then pg_ready=1; break; fi
            sleep 2
          done
          test "$pg_ready" -eq 1
          echo "CASH_PILOT_ALLOW_TEST_SETUP=1" >> "$GITHUB_ENV"
          echo "CASH_PILOT_PG_ADMIN_URL=postgresql+psycopg://postgres:$pg_admin_password@127.0.0.1:55439/cashpilot_checks" >> "$GITHUB_ENV"
          echo "CASH_PILOT_PG_RUNTIME_URL=postgresql+psycopg://cashpilot_backend:$pg_runtime_password@127.0.0.1:55439/cashpilot_checks" >> "$GITHUB_ENV"
      - name: Apply and verify PostgreSQL migrations
        run: python prepare_test_postgres.py
      - name: Check PostgreSQL concurrency and restricted runtime permissions
        run: python -m pytest test_postgres_integration.py -q
      - name: Remove isolated test container
        if: always()
        run: docker rm --force cashpilot-pg-checks || true
